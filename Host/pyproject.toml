[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stm32-oscilloscope-host"
version = "0.1.0"
description = "Host program that plots samples streamed from the STM32 oscilloscope"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["scope"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["scope"]
